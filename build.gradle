plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.76'
}
version = '1.1.12'
group = 'dev.codex.fireflysam'
base { archivesName = 'firefly-sam' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.209'
    runs {
        client { client(); gameDirectory = file('run/client') }
        server { server(); gameDirectory = file('run/server'); programArgument '--nogui' }
    }
    mods { firefly_sam { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources') {
    from(rootProject.files('LICENSE', 'CREDITS.md')) { into 'META-INF' }
}
tasks.register('combatTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.codex.fireflysam.CombatRulesTest'
}
tasks.named('check') { dependsOn tasks.named('combatTest') }
