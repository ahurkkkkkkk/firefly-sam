plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.76'
}
repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
}
dependencies {
    implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.4'
}
version = '2.0.1'
group = 'dev.codex.fireflysam'
base { archivesName = 'firefly-sam' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.209'
    runs {
        client { client(); gameDirectory = file('run/client') }
        server { server(); gameDirectory = file('run/server'); programArgument '--nogui' }
    }
    mods { firefly_sam { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
def refreshSamRigAssetsProvider = providers.gradleProperty('refreshSamRigAssets').orElse('false')
tasks.register('exportLocalSamBlockbenchRig', Exec) {
    def samMesh = file('src/main/resources/assets/firefly_sam/models/sam_rig.fmesh')
    def walkCycle = file('src/main/resources/assets/firefly_sam/walk_data/sam_walk_cycle.json')
    def geckoModel = file('src/main/resources/assets/firefly_sam/geo/sam_rig.geo.json')
    def geckoAnimations = file('src/main/resources/assets/firefly_sam/animations/sam_rig.animation.json')
    def blockbenchProject = file('artifacts/Blockbench/SAM_rig.bbmodel')
    onlyIf { samMesh.exists() && walkCycle.exists() &&
             (refreshSamRigAssetsProvider.get() == 'true' || !geckoModel.exists() || !geckoAnimations.exists() || !blockbenchProject.exists()) }
    workingDir projectDir
    commandLine 'python', 'scripts/export_sam_blockbench.py'
    inputs.files(samMesh, walkCycle, file('artifacts/animations/quaternius-ual/sam_sprint_cycle.json'))
    outputs.files(geckoModel, geckoAnimations, blockbenchProject)
}
tasks.named('processResources') {
    dependsOn tasks.named('exportLocalSamBlockbenchRig')
    from(rootProject.files('LICENSE', 'CREDITS.md')) { into 'META-INF' }
}
tasks.register('combatTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.codex.fireflysam.CombatRulesTest'
}
tasks.named('check') { dependsOn tasks.named('combatTest') }
